# FunnyOS 引导配置
#
# 关键选项说明：
#   timeout: 0    立即引导默认入口，不显示菜单。
#                 无头测试必需——否则 QEMU 会卡在菜单上等按键。
#
#   serial: yes   让引导器自身也把输出写到 COM1。
#                 这条很重要：如果引导失败（找不到内核、镜像损坏），
#                 QEMU 的串口日志里会留下 Limine 的报错，
#                 否则无头模式下只能看到一片沉默。

timeout: 0
serial: yes
serial_baudrate: 115200

/FunnyOS
    protocol: limine
    kernel_path: boot():/boot/funyos.elf
    resolution: 1024x768x32
