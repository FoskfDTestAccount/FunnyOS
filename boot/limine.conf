# FunnyOS boot configuration
#
# Key options:
#
#   timeout: 0    Boot the default entry immediately without showing the
#                 menu. Required for headless testing -- otherwise QEMU
#                 sits on the menu waiting for a keypress.
#
#   serial: yes   Have the bootloader itself write to COM1 as well.
#                 This matters: if booting fails (kernel not found,
#                 corrupt image), the failure is visible in QEMU's serial
#                 log. Without it, headless mode shows nothing at all.
#
# ---------------------------------------------------------------------
# On the kernel_path, and why it does not use boot():
#
# `boot():` means "the partition holding the config file, on the boot
# drive". That depends on Limine successfully matching the device it was
# booted from with a readable volume. Some firmware/VM combinations fail
# that match -- Limine then warns
#
#     Could not meaningfully match the boot device handle with a volume
#
# and falls back to scanning for a volume containing a config. The config
# is still found, but `boot():` no longer resolves, and the kernel cannot
# be opened:
#
#     PANIC: Failed to open executable with path `boot():/boot/funyos.elf`
#
# This was observed in VMware Workstation. `fslabel()` sidesteps the whole
# problem: it locates the volume by its ISO 9660 volume identifier, which
# requires no boot-device matching at all.
#
# The label is set by the ISO build (see VOLID in the Makefile). If you
# change it in one place, change it in the other -- the Makefile verifies
# the built image actually carries the expected label.

timeout: 0
serial: yes
serial_baudrate: 115200

/FunnyOS
    protocol: limine
    kernel_path: fslabel(FUNNYOS):/boot/funyos.elf
    resolution: 1024x768x32
