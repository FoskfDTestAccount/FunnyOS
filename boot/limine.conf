# FunnyOS boot configuration
#
# Key options:
#
#   timeout: 0    Boot the default entry immediately without showing the
#                 menu. Required for headless testing -- otherwise QEMU
#                 sits on the menu waiting for a keypress.
#
#   serial: yes   Have the bootloader itself write to COM1 as well.
#                 This matters: if booting fails (kernel not found,
#                 corrupt image), the failure is visible in QEMU's serial
#                 log. Without it, headless mode shows nothing at all.

timeout: 0
serial: yes
serial_baudrate: 115200

/FunnyOS
    protocol: limine
    kernel_path: boot():/boot/funyos.elf
    resolution: 1024x768x32
